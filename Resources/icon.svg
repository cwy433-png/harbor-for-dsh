  <circle cx="512" cy="420" r="40" fill="#ffffff"/>

  <g stroke="#ffffff" stroke-width="44" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M236 664 q69 -52 138 0 q69 52 138 0 q69 -52 138 0 q69 52 138 0"/>
